    function loadPdfJs() {
        if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
        if (!pdfjsPromise) {
            pdfjsPromise = new Promise(function (resolve, reject) {
                var s = document.createElement('script');
                s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
                s.onload = function () {
                    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
                        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                    resolve(window.pdfjsLib);
                };
                s.onerror = function () {
                    pdfjsPromise = null;
                    reject(new Error('PDF.js load failed'));
                };
                document.head.appendChild(s);
            });
        }
        return pdfjsPromise;
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function init() {
        var booksGrid = document.getElementById('booksGrid');

        var pdfViewer = document.getElementById('pdfViewer');

        var pdfPrevBtn = document.getElementById('pdfPrev');
        var pdfNextBtn = document.getElementById('pdfNext');
        var pdfPageInput = document.getElementById('pdfPageInput');
        var pdfTotal = document.getElementById('pdfTotal');
        var pdfExInput = document.getElementById('pdfExInput');
        var pdfExBtn = document.getElementById('pdfExBtn');
        var pdfExStatus = document.getElementById('pdfExStatus');
        var textViewer = document.getElementById('textViewer');
        var textContentWrapper = document.getElementById('textContentWrapper');
        var closeModal = document.getElementById('closeModal');
        var modalTitle = document.getElementById('modalTitle');
        var imageViewer = document.getElementById('imageViewer');
        var fullImage = document.getElementById('fullImage');
        var closeImage = document.getElementById('closeImage');

        function renderBooks(filteredBooks) {
            booksGrid.innerHTML = '';
            if (filteredBooks.length === 0) {
                booksGrid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#6b7280;padding:40px;font-weight:500;">Нічого не знайдено</p>';
                return;
            }

            filteredBooks.forEach(function (book) {
                var card = document.createElement('div');
                card.className = 'book-card';
                card.setAttribute('data-cat', book.category);

                var pickerHtml = '';
                var actionButtons = '';

                if (book.type === 'pdf') {
                    pickerHtml = '<div class="picker"><label>Сторінка:<input type="number" min="1" inputmode="numeric" class="page-input" placeholder=""></label></div>';
                    actionButtons = '<button class="btn btn-primary open-btn" data-id="' + book.id + '">Читати</button>' +
                        '<a href="' + escapeHtml(book.downloadUrl) + '" download class="btn btn-download" title="Скачати">' +
                        '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></a>';
                } else if (book.type === 'text') {
                    // Використовуємо btn-primary замість btn-read для байок, щоб вони були фіолетовими
                    actionButtons = '<button class="btn btn-primary open-text-btn" data-id="' + book.id + '">Читати</button>';
                }

                var coverHtml;
                if (book.cover.indexOf('http') === 0) {
                    coverHtml = '<img src="' + escapeHtml(book.cover) + '" alt="' + escapeHtml(book.title) + '" loading="lazy" class="cover-img">';
                } else {
                    coverHtml = '<span class="emoji-fallback">' + book.cover + '</span>';
                }

                var badgeLabel = book.label || CATEGORIES[book.category] || 'Інше';

                card.innerHTML =
                    '<div class="book-cover">' + coverHtml + '</div>' +
                    '<div class="book-info">' +
                    '<span class="badge">' + badgeLabel + '</span>' +
                    '<h3>' + escapeHtml(book.title) + '</h3>' +
                    '<p class="author">' + escapeHtml(book.author) + '</p>' +
                    pickerHtml +
                    '<div class="actions">' + actionButtons + '</div>' +
                    '</div>';
                booksGrid.appendChild(card);
            });
        }

        function resolveTarget(card) {
            var pageVal = card.querySelector('.page-input').value.trim();
            var n = parseInt(pageVal, 10);
            return !isNaN(n) && n > 0 ? n : null;
        }

        function renderPage(num) {
            if (!pdfDoc) return Promise.resolve();
            if (renderTask) {
                try { renderTask.cancel(); } catch (e) {}
                renderTask = null;
            }
            return pdfDoc.getPage(num).then(function (p) {
                var wrapWidth = (pdfCanvasWrap.clientWidth || window.innerWidth) - 24;
                var base = p.getViewport({ scale: 1 });
                var scale = Math.min(wrapWidth / base.width, 2.5);
                var dpr = window.devicePixelRatio || 1;
                var vp = p.getViewport({ scale: scale * dpr });

                pdfCanvas.width = vp.width;
                pdfCanvas.height = vp.height;
                pdfCanvas.style.width = (vp.width / dpr) + 'px';
                pdfCanvas.style.height = (vp.height / dpr) + 'px';

                pdfPage = num;
                pdfPageInput.value = num;
                pdfTotal.textContent = '/ ' + pdfDoc.numPages;
                pdfPrevBtn.disabled = num <= 1;
                pdfNextBtn.disabled = num >= pdfDoc.numPages;

                renderTask = p.render({ canvasContext: pdfCanvas.getContext('2d'), viewport: vp });
                return renderTask.promise;
            }).then(function () {
                renderTask = null;
            }, function (err) {
                renderTask = null;
                if (err && err.name === 'RenderingCancelledException') return;
                throw err;
            });
        }

        function getPageText(num) {
            if (pageTextCache[num] !== undefined) return Promise.resolve(pageTextCache[num]);
            return pdfDoc.getPage(num).then(function (p) {
                return p.getTextContent().then(function (tc) {
                    var text = tc.items.map(function (item) { return item.str; }).join(' ');
                    pageTextCache[num] = text;
                    return text;
                });
            });
        }

        function findExercisePage(n, searchId) {
            var re = new RegExp('Вправа\\s*№?\\s*' + n + '(?!\\d)', 'i');
            var total = pdfDoc.numPages;
            var current = 1;

            function step() {
                if (searchId !== exSearchId || !pdfDoc) return Promise.resolve(null);
                if (current > total) return Promise.resolve(null);
                var num = current++;
                return getPageText(num).then(function (text) {
                    if (re.test(text)) return num;
                    return step();
                });
            }
            return step();
        }

        function searchExercise() {
            if (!pdfDoc) return;
            var n = parseInt(pdfExInput.value, 10);
            if (isNaN(n) || n < 1) {
                pdfExStatus.textContent = 'Введіть номер вправи';
                return;
            }
            var searchId = ++exSearchId;
            pdfExStatus.textContent = 'Пошук...';
            pdfExBtn.disabled = true;

            findExercisePage(n, searchId).then(function (num) {
                if (searchId !== exSearchId) return;
                pdfExBtn.disabled = false;
                if (num) {
                    pdfExStatus.textContent = '';
                    renderPage(num);
                } else {
                    pdfExStatus.textContent = 'Вправу ' + n + ' не знайдено';
                }
            }).catch(function () {
                if (searchId !== exSearchId) return;
                pdfExBtn.disabled = false;
                pdfExStatus.textContent = 'Помилка пошуку';
            });
        }

        function openPdf(url, title, page) {
            pdfViewer.style.display = 'none';
            pdfViewer.src = '';
            textViewer.style.display = 'none';
            pdfCanvasWrap.style.display = 'block';
            modalTitle.textContent = page ? title + ' - стор. ' + page : title;
            pdfModal.classList.add('active');
            document.body.style.overflow = 'hidden';

            exSearchId++;
            pageTextCache = {};
            pdfExStatus.textContent = '';
            pdfExInput.value = '';
            if (pdfDoc) { try { pdfDoc.destroy(); } catch (e) {} pdfDoc = null; }

            loadPdfJs()
                .then(function (lib) { return lib.getDocument(url).promise; })
                .then(function (doc) {
                    pdfDoc = doc;
                    var target = Math.min(Math.max(page || 1, 1), doc.numPages);
                    return renderPage(target);
                })
                .catch(function () {
                    pdfCanvasWrap.style.display = 'none';
                    textViewer.style.display = 'block';
                    textContentWrapper.innerHTML = '<p style="text-align:center;color:#ef4444;padding:20px;">Не вдалося</p>';
                });
        }

        function openText(content, title, author) {
            pdfViewer.style.display = 'none';
            pdfViewer.src = '';
            pdfCanvasWrap.style.display = 'none';
            textViewer.style.display = 'block';
            textContentWrapper.innerHTML =
                '<h2>' + escapeHtml(title) + '</h2>' +
                '<div class="text-author">' + escapeHtml(author) + '</div>' +
                '<p>' + escapeHtml(content) + '</p>';
            modalTitle.textContent = title;
            pdfModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeReader() {
            pdfModal.classList.remove('active');
            pdfViewer.src = '';
            pdfCanvasWrap.style.display = 'none';
            exSearchId++;
            pageTextCache = {};
            if (renderTask) { try { renderTask.cancel(); } catch (e) {} renderTask = null; }
            if (pdfDoc) { try { pdfDoc.destroy(); } catch (e) {} pdfDoc = null; }
            document.body.style.overflow = '';
        }

        function openImage(src, alt) {
            fullImage.src = src;
            fullImage.alt = alt;
            imageViewer.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeFullImage() {
            imageViewer.classList.remove('active');
            fullImage.src = '';
            document.body.style.overflow = '';
        }

        pdfPrevBtn.addEventListener('click', function () {
            if (pdfDoc && pdfPage > 1) renderPage(pdfPage - 1);
        });
        pdfNextBtn.addEventListener('click', function () {
            if (pdfDoc && pdfPage < pdfDoc.numPages) renderPage(pdfPage + 1);
        });
        pdfPageInput.addEventListener('change', function () {
            var n = parseInt(this.value, 10);
            if (pdfDoc && n >= 1 && n <= pdfDoc.numPages) renderPage(n);
            else this.value = pdfPage;
        });
        pdfPageInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') this.blur();
        });

        pdfExBtn.addEventListener('click', searchExercise);
        pdfExInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                searchExercise();
            }
        });

        closeModal.addEventListener('click', closeReader);
        closeImage.addEventListener('click', closeFullImage);
        imageViewer.addEventListener('click', function (e) {
            if (e.target === imageViewer) closeFullImage();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                if (imageViewer.classList.contains('active')) closeFullImage();
                else if (pdfModal.classList.contains('active')) closeReader();
            }
        });

        booksGrid.addEventListener('click', function (e) {
            var cover = e.target.closest('.cover-img');
            if (cover) { openImage(cover.src, cover.alt); return; }

            var openBtn = e.target.closest('.open-btn');
            if (openBtn) {
                var book = BOOKS.find(function (b) { return b.id === Number(openBtn.dataset.id); });
                if (!book) return;
                var card = openBtn.closest('.book-card');
                openPdf(book.viewUrl, book.title, resolveTarget(card));
                return;
            }

            var textBtn = e.target.closest('.open-text-btn');
            if (textBtn) {
                var tb = BOOKS.find(function (b) { return b.id === Number(textBtn.dataset.id); });
                if (!tb) return;

                modalTitle.textContent = tb.title;
                pdfModal.classList.add('active');
                document.body.style.overflow = 'hidden';
                pdfViewer.style.display = 'none';
                pdfCanvasWrap.style.display = 'none';
                textViewer.style.display = 'block';
                textContentWrapper.innerHTML = '<p style="text-align:center; color:#6b7280;">Завантаження...</p>';

                fetch(tb.fileUrl)
                    .then(function (response) {
                        if (!response.ok) throw new Error('Помилка завантаження');
                        return response.text();
                    })
                    .then(function (text) {
                        openText(text, tb.title, tb.author);
                    })
                    .catch(function () {
                        textContentWrapper.innerHTML = '<p style="text-align:center; color:#ef4444; padding: 20px; font-weight: 500;">Не вдалося</p>';
                    });
            }
        });

        booksGrid.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && e.target.matches('.page-input')) {
                var card = e.target.closest('.book-card');
                var btn = card.querySelector('.open-btn');
                if (btn) btn.click();
            }
        });

        function filterBooks() {
            var searchTerm = searchInput.value.toLowerCase().trim();
            var category = categoryFilter.value;
            var filtered = BOOKS.filter(function (book) {
                var matchesSearch = book.title.toLowerCase().indexOf(searchTerm) !== -1 || book.author.toLowerCase().indexOf(searchTerm) !== -1;
                return matchesSearch && book.category === category;
            });
            renderBooks(filtered);
        }

        searchInput.addEventListener('input', filterBooks);
        categoryFilter.addEventListener('change', filterBooks);
        categoryFilter.value = 'ukr-mova';
        filterBooks();
    }

    fetch('https://ipapi.co/json/')
        .then(function (r) { return r.json(); })
        .then(function (data) {
            if (data.country_code === 'RU') {
                document.getElementById('blockScreen').style.display = 'flex';
                document.getElementById('appRoot').style.display = 'none';
                document.getElementById('appRoot').innerHTML = '';
            } else {
                buildApp();
            }
        })
        .catch(function () {
            document.getElementById('blockScreen').style.display = 'flex';
        });
})();
</script>

</body>
</html>
